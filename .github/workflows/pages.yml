# Prueba y publica Circuito Base en GitHub Pages en cada push a main.
# Todas estas comprobaciones deben pasar antes de desplegar:
#   1. Contenido y motores (Node)
#   2. Compilación real de todos los sketches para Arduino Uno R3 (avr-gcc + ArduinoCore-avr)
#      y simulación de su comportamiento en un ATmega328P emulado (avr8js)
#   3. Pruebas de extremo a extremo en Chromium, Firefox y WebKit (motor de Safari)
#   4. Auditoría de accesibilidad WCAG 2.2 AA con axe-core
name: Pruebas y despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  contenido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de contenido y motores
        run: node --test tests/*.test.js

  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar compilador AVR, núcleo de Arduino y librerías
        run: |
          mkdir -p "$RUNNER_TEMP/avr" && cd "$RUNNER_TEMP/avr"
          curl -sSL https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2 | tar xj
          git clone -q --depth 1 https://github.com/arduino/ArduinoCore-avr.git
          git clone -q --depth 1 https://github.com/arduino-libraries/Servo.git
          git clone -q --depth 1 https://github.com/johnrickman/LiquidCrystal_I2C.git
      - name: Compilar todos los sketches para Arduino Uno R3
        env:
          AVR_GCC_DIR: ${{ runner.temp }}/avr/avr-gcc-14.1.0-x64-linux
          ARDUINO_CORE: ${{ runner.temp }}/avr/ArduinoCore-avr
          ARDUINO_LIBS: ${{ runner.temp }}/avr
          HEX_DIR: build-hex
        run: python3 tests/compile_sketches.py
      - name: Instalar el emulador AVR (avr8js)
        run: npm ci --no-audit --no-fund
      - name: Simular el comportamiento de los sketches en un ATmega328P
        run: node tests/simulate_sketches.js

  navegador:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright y ${{ matrix.browser }}
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Pruebas de extremo a extremo en ${{ matrix.browser }}
        run: python tests/e2e.py --browser ${{ matrix.browser }}

  accesibilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar axe-core, Playwright y Chromium
        run: |
          npm ci --no-audit --no-fund
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Auditoría WCAG 2.2 AA (temas claro y oscuro)
        run: python tests/a11y.py

  desplegar:
    needs: [contenido, compilar, navegador, accesibilidad]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio (solo los archivos de la app)
        run: |
          mkdir _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
